spring.application.name=footfirma

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.default-produces-media-type=application/json

# Schema governado exclusivamente por Flyway — ddl-auto nunca gera DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.threads.virtual.enabled=true

# Geração do mundo — o MundoRunner só existe sob o profile "mundo".
# Geração: ./gradlew bootRun --args='--spring.profiles.active=mundo'
#
# recriar=false é o default seguro: subir com o profile e apagar o catálogo por
# descuido é pior que gerar por cima. Trocar a semente exige recriar=true, senão o
# mundo anterior fica órfão — os slugs novos não colidem com os antigos.
footfirma.mundo.semente=20260803
footfirma.mundo.recriar=false
footfirma.mundo.encerrar-ao-final=true
