name: release-please (staging)

# Abre o PR de release candidate na `staging`. Roda a cada merge de feature.
# Este fluxo é deliberadamente estéril: com `skip-changelog` e sem `version.txt`
# nos pacotes, o PR de release só altera `manifest.staging.json` — nenhum arquivo
# compartilhado com o fluxo da `main`, logo nenhum conflito no PR staging -> main.
on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-staging
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: staging
          config-file: .github/release-please/config.staging.json
          manifest-file: .github/release-please/manifest.staging.json
